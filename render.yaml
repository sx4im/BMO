services:
  - type: web
    name: bimo-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Preserve independent request capacity when model streams occupy threads.
    startCommand: gunicorn -w 2 -k gthread --threads 8 --timeout 600 --bind 0.0.0.0:$PORT app.main:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: bimo-attachments
      - key: NVIDIA_API_KEY
        sync: false
      # Image generation (Iris). Served via NVIDIA's GenAI endpoint. The model
      # (FLUX 3 Klein, 50 steps) is fixed in code; NVIDIA_IMAGE_MODEL is ignored.
      - key: NVIDIA_IMAGE_BASE_URL
        value: https://ai.api.nvidia.com/v1/genai
      - key: CORS_ORIGINS
        value: https://bimo.qzz.io,http://localhost:5500,http://127.0.0.1:5500
      # Rate limiting is ON for the live deployment (per-user keying with IP
      # fallback). Point RATELIMIT_STORAGE_URI at a Redis URL so limits are
      # accurate across workers (in-memory only limits per worker).
      - key: RATELIMIT_ENABLED
        value: "1"
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      # WhatsApp Cloud API Integration
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: bimo_whatsapp_verify_token_2026
      - key: WHATSAPP_APP_SECRET
        sync: false
      # Groq AI for Nexos and Aeon
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_NEXOS_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_AEON_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_MAX_TOKENS
        value: "16384"
      # Mistral AI for Stanza and attachment analysis
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: ministral-8b-2512
      - key: MISTRAL_VISION_MODEL
        value: ministral-14b-2512
      # Web Search & Scraping (TinyFish)
      - key: TINYFISH_API_KEY
        sync: false
      # Autonomous search routing (Groq, rules when unavailable)
      - key: SEARCH_CLASSIFIER_MODEL
        value: qwen/qwen3.8-27b
      - key: SEARCH_CLASSIFIER_TIMEOUT_S
        value: "1.5"
      # Deepgram Nova-3 streaming STT + Flux streaming TTS
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_TTS_MODEL
        value: flux-hannah-en


